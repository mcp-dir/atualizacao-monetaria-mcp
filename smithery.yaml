# Smithery configuration for Atualização Monetária
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_atualizacao-monetaria

name: atualizacao-monetaria-mcp
displayName: "Atualização Monetária"
description: >
  **Atualização monetária** automática para IA. Corrija qualquer valor por IPCA, INPC, IGP-M, SELIC, TR e outros índices oficiais, com juros, multa e honorários. Índices buscados ao vivo no BACEN e no IBGE, sem login.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/atualizacao-monetaria-mcp
repository: https://github.com/mcp-dir/atualizacao-monetaria-mcp

tags:
  - juridico
  - legal
  - atualizacao-monetaria
  - correcao-monetaria
  - indices
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_atualizacao-monetaria

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_atualizacao-monetaria/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
